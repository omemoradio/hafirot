<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>חפירות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:'Rubik',system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
.px{border:4px solid #1b1b1f;box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.18)}
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:8px;flex-wrap:wrap;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#zoneTag{background:#2d2d35;padding:6px 10px;font-weight:700;font-size:14px;line-height:1.2}
#zoneTag small{display:block;font-weight:400;color:#c9c9d6;font-size:12px}
#inv{display:flex;gap:4px;background:#2d2d35;padding:4px}
.slot{width:46px;height:46px;background:#8b8b93;position:relative;display:flex;align-items:center;justify-content:center;border:3px solid #3a3a42;box-shadow:inset 3px 3px 0 #55555d,inset -3px -3px 0 #b5b5bd}
.slot img,.slot canvas{width:30px;height:30px;image-rendering:pixelated}
.slot b{position:absolute;bottom:0;left:3px;font-size:14px;font-weight:900;text-shadow:2px 2px 0 #000}
.slot.tool{background:#6d5a3f}
#btns{display:flex;gap:4px;margin-inline-start:auto}
.ibtn{width:46px;height:46px;font-size:22px;background:#6b6b75;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.ibtn:active{transform:translateY(2px)}
#xp{background:#2d2d35;padding:6px 10px;font-weight:700;font-size:14px}
#xp span{color:#7CFC6A}
#pad{position:fixed;left:14px;bottom:14px;display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,62px);gap:6px;direction:ltr;z-index:5}
#pad button{font-size:24px;background:rgba(70,70,80,.82);color:#fff;font-family:inherit;touch-action:none}
#pad button:active,#pad button.on{background:rgba(120,120,135,.95)}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .d{grid-column:2;grid-row:2}#pad .r{grid-column:3;grid-row:2}
@media (hover:hover) and (pointer:fine){#pad{opacity:.55}}
#hint{position:fixed;right:14px;bottom:14px;max-width:260px;background:rgba(30,30,36,.85);padding:8px 12px;font-size:13px;line-height:1.5;z-index:4;color:#ddd}
@media (max-width:640px){#hint{display:none}.slot{width:40px;height:40px}.ibtn{width:40px;height:40px;font-size:19px}#zoneTag{font-size:12px}}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:20;padding:10px}
#overlay.hidden{display:none}
.panel{background:#c6c6c6;color:#222;width:min(680px,100%);max-height:calc(100vh - 20px);overflow:auto;padding:16px 18px;border:4px solid #000;box-shadow:inset -5px -5px 0 #555,inset 5px 5px 0 #fff}
.panel h2{margin:0 0 8px;font-size:24px;font-weight:900}
.panel h3{margin:14px 0 6px;font-size:18px}
.chip{display:inline-block;padding:3px 10px;font-size:13px;font-weight:700;color:#fff;margin-bottom:8px;border:2px solid #000}
.qtext{font-size:21px;font-weight:700;line-height:1.5;margin:6px 0 12px}
.opts{display:grid;gap:8px}
.opt{font-family:inherit;font-size:18px;font-weight:500;text-align:right;padding:11px 14px;background:#8b8b8b;color:#fff;cursor:pointer;border:3px solid #000;box-shadow:inset -4px -4px 0 #555,inset 4px 4px 0 #b9b9b9;text-shadow:1px 1px 0 #333}
.opt:hover:not(:disabled){background:#9a9ab5;box-shadow:inset -4px -4px 0 #5a5a80,inset 4px 4px 0 #c8c8ff}
.opt.ok{background:#3f9b3a!important;box-shadow:inset -4px -4px 0 #24601f,inset 4px 4px 0 #7fd877!important}
.opt.bad{background:#b83a32!important;box-shadow:inset -4px -4px 0 #6d1e19,inset 4px 4px 0 #f08a82!important}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:10px 12px;font-size:16px;line-height:1.6;border:3px solid #000}
.fb.ok{background:#d5f5cf}.fb.bad{background:#fbd9d5}
.fb b{font-size:18px}
.btn{font-family:inherit;font-size:18px;font-weight:700;padding:10px 20px;background:#6b8f3a;color:#fff;cursor:pointer;border:3px solid #000;box-shadow:inset -4px -4px 0 #3c5520,inset 4px 4px 0 #a2c86a;text-shadow:1px 1px 0 #222;margin-top:12px}
.btn.gray{background:#7a7a7a;box-shadow:inset -4px -4px 0 #444,inset 4px 4px 0 #aaa}
.btn:disabled{opacity:.45;cursor:default}
.doc{background:#fbf6e6;border:3px solid #6b5a3a;padding:10px 14px;margin-bottom:10px;max-height:38vh;overflow:auto;line-height:1.75;font-size:16px;color:#2a2418;user-select:text;-webkit-user-select:text}
.doc-t{font-size:19px;font-weight:900;margin-bottom:2px}
.doc-by{font-size:13px;color:#6b5a3a;margin-bottom:6px;border-bottom:1px dashed #b9a67f;padding-bottom:5px}
.doc p{margin:0 0 8px}
.recipe{display:flex;align-items:center;gap:12px;background:#8b8b8b;padding:10px;margin-bottom:8px;border:3px solid #000;color:#fff}
.recipe .r-txt{flex:1;font-size:15px;line-height:1.5}
.recipe .r-txt b{font-size:17px}
.recipe canvas{width:44px;height:44px;image-rendering:pixelated;background:#555;border:2px solid #000}
.statrow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:15px}
.statrow .nm{width:190px;font-weight:700}
.bar{flex:1;height:18px;background:#888;border:2px solid #000;position:relative}
.bar i{position:absolute;top:0;bottom:0;right:0;background:#3f9b3a}
.mist{font-size:14px;line-height:1.5;background:#e4e4e4;border:2px solid #777;padding:6px 8px;margin:5px 0}
.mist .a{color:#1d6b18;font-weight:700}
table.cs{width:100%;border-collapse:collapse;font-size:15px;background:#eee}
table.cs td,table.cs th{border:2px solid #555;padding:5px 7px;text-align:right;vertical-align:top}
table.cs th{background:#777;color:#fff}
ul.cs{margin:4px 0;padding-inline-start:20px;line-height:1.7;font-size:15px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tab{font-family:inherit;font-size:14px;font-weight:700;padding:6px 10px;background:#8b8b8b;color:#fff;border:3px solid #000;cursor:pointer}
.tab.on{background:#4a6fa5}
.bossbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;background:#2b2233;padding:8px;border:3px solid #000;color:#fff}
.bossbar canvas{width:64px;height:64px;image-rendering:pixelated}
.hp{flex:1}
.hp .bar i{background:#b04fe0}
.hearts{font-size:20px;letter-spacing:2px}
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:rgba(25,25,30,.92);padding:10px 16px;font-size:16px;font-weight:500;z-index:15;max-width:90vw;text-align:center;border:3px solid #000;display:none;line-height:1.5}
#banner{position:fixed;top:30%;left:0;right:0;text-align:center;z-index:12;pointer-events:none;opacity:0;transition:opacity .5s}
#banner.show{opacity:1}
#banner div{display:inline-block;background:rgba(0,0,0,.7);padding:14px 26px;border:4px solid #000}
#banner .b1{font-size:30px;font-weight:900;display:block;text-shadow:3px 3px 0 #000}
#banner .b2{font-size:17px;color:#ffe27a;display:block;margin-top:4px}
.title{font-size:40px;font-weight:900;text-align:center;color:#3d3d3d;text-shadow:3px 3px 0 #fff;margin:4px 0}
.sub{text-align:center;font-size:17px;margin-bottom:10px}
.center{text-align:center}
.small{font-size:14px;color:#444;line-height:1.6}

#parent{position:fixed;inset:0;background:#0b0b12;color:#eee;overflow:auto;display:none;z-index:100;touch-action:auto;-webkit-user-select:text;user-select:text;font:500 15px/1.5 Rubik}
#parent.on{display:block}
#parent .pw{max-width:980px;margin:0 auto;padding:22px 18px 60px}
#parent h1{font:900 26px Rubik;margin:0;display:flex;align-items:center;gap:10px}
#parent h1 .tag{font-size:15px;color:#f2c418;border:2px solid #f2c418;padding:1px 8px}
#parent h2{font:700 18px Rubik;margin:28px 0 10px;color:#f2c418}
.ptop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ptop .sp{flex:1}
#parent .chip{display:inline-block;border:1px solid #555;border-radius:999px;padding:3px 12px;font-size:13px;color:#ccc;font-weight:500;margin:0}
#parent .chip.ok{border-color:#3a6;color:#7e7}
.pbtn{background:#1c1c28;color:#fff;border:1px solid #444;border-radius:8px;padding:7px 14px;font:700 14px Rubik;cursor:pointer}
.pbtn:hover{border-color:#f2c418}
.pbtn.danger{border-color:#733;color:#f99}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.card{background:#151520;border:1px solid #2a2a3a;border-radius:10px;padding:12px 14px}
.card b{display:block;font:900 26px Rubik;color:#fff}
.card span{color:#aaa;font-size:13px}
table.pt{width:100%;border-collapse:collapse;font-size:14px}
table.pt th{text-align:right;color:#999;font-weight:700;border-bottom:1px solid #333;padding:6px 8px}
table.pt td{border-bottom:1px solid #222;padding:7px 8px;vertical-align:middle}
.ptw{overflow-x:auto}
.pbar{height:12px;background:#262636;border-radius:6px;overflow:hidden;min-width:120px;position:relative}
.pbar i{position:absolute;right:0;top:0;bottom:0;border-radius:6px}
.rec{background:#1a1a10;border:1px solid #554;border-radius:10px;padding:12px 14px;margin-top:12px}
.days{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:10px;direction:ltr}
.day{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:#888}
.day .col{width:100%;max-width:34px;background:#2d6cdf;border-radius:4px 4px 0 0;position:relative}
.day .col i{position:absolute;left:0;right:0;bottom:0;background:#36c36b;border-radius:4px 4px 0 0}
.day .n{color:#ccc;font-size:11px}
.legend{font-size:12px;color:#999;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 2px;vertical-align:middle}
.muted{color:#888}
#copyArea{width:100%;height:160px;background:#111;color:#eee;border:1px solid #444;margin-top:8px;display:none;font:13px monospace;direction:rtl}
.note{font-size:13px;color:#999;margin-top:8px}
.pview{margin-top:18px;display:flex;align-items:center;gap:10px;font-weight:700;background:#151520;border:1px solid #2a2a3a;border-radius:10px;padding:10px 14px}
.pview select{background:#000;color:#f2c418;border:1px solid #555;border-radius:6px;font:700 15px Rubik;padding:4px 8px}
tr.psel td{background:#1d1d10}
#nameIn{font-family:inherit;font-size:20px;padding:8px 12px;border:3px solid #000;width:min(320px,100%);text-align:center}
#nameIn.err{border-color:#b83a32;background:#fde}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="zoneTag" class="px"></div>
  <div id="inv" class="px"></div>
  <div id="xp" class="px">⭐ <span id="xpv">0</span> · 🔥 <span id="stv">0</span></div>
  <div id="btns">
    <button class="ibtn px" id="bCraft" title="שולחן מלאכה">🛠️</button>
    <button class="ibtn px" id="bStats" title="ההתקדמות שלי">📊</button>
    <button class="ibtn px" id="bHelp" title="מגילות ידע ועזרה">📜</button>
    <button class="ibtn px" id="bMusic" title="מוזיקה">🎵</button>
    <button class="ibtn px" id="bMute" title="צליל">🔊</button>
  </div>
</div>
<div id="pad">
  <button class="u px" data-k="U">▲</button>
  <button class="l px" data-k="L">◀</button>
  <button class="d px" data-k="D">▼</button>
  <button class="r px" data-k="R">▶</button>
</div>
<div id="hint" class="px">חיצים / WASD: זזים וחוצבים · ▲ קפיצה · ▼ חציבה למטה · אפשר גם ללחוץ על בלוק צמוד</div>
<div id="toast"></div>
<div id="banner"><div><span class="b1" id="ban1"></span><span class="b2" id="ban2"></span></div></div>
<div id="overlay"><div class="panel" id="panel"></div></div>
<div id="parent"><div class="pw" id="pw"></div></div>

<script>
"use strict";
/* ================= CONTENT ================= */

// [question, [correct, wrong...], explanation]
const CONN=[
[`רציתי לצאת לשחק בחוץ, ___ התחיל לרדת גשם.`,[`אבל`,`לכן`,`כדי`,`למשל`],`"אבל" מביעה <b>ניגוד</b>: רציתי לצאת – אבל קרה משהו שמנע את זה.`],
[`דני התאמן כל יום, ___ ניצח בתחרות.`,[`ולכן`,`אף על פי ש`,`כאילו`,`למרות`],`"ולכן" מביעה <b>תוצאה</b>: האימונים (סיבה) ← הניצחון (תוצאה).`],
[`לא הלכתי לבית הספר ___ הייתי חולה.`,[`כי`,`לכן`,`אולם`,`כדי`],`"כי" מביעה <b>סיבה</b>: למה לא הלכתי? כי הייתי חולה.`],
[`קמתי מוקדם ___ להספיק לאוטובוס.`,[`כדי`,`כי`,`אבל`,`לכן`],`"כדי" מביעה <b>תכלית (מטרה)</b>: בשביל מה קמתי מוקדם? כדי להספיק.`],
[`___ תסיים את שיעורי הבית, תוכל לשחק.`,[`אם`,`למרות ש`,`משום ש`,`אולם`],`"אם" מביעה <b>תנאי</b>: המשחק תלוי בסיום שיעורי הבית.`],
[`בגן החיות יש חיות רבות, ___ אריות, ג'ירפות וזברות.`,[`כגון`,`לכן`,`אך`,`כדי`],`"כגון" מביעה <b>דוגמה</b>: אריות, ג'ירפות וזברות הן דוגמאות לחיות.`],
[`הוא לא רק שר יפה, ___ מנגן בגיטרה.`,[`אלא גם`,`אלא אם כן`,`כי`,`לכן`],`הצירוף "לא רק... <b>אלא גם</b>" מביע <b>הוספה</b>.`],
[`___ שהיה עייף מאוד, המשיך ללמוד עד מאוחר.`,[`למרות`,`בגלל`,`כדי`,`לכן`],`"למרות ש" מביעה <b>ויתור</b>: היה עייף – ובכל זאת המשיך. ציפינו שיפסיק, אבל זה לא קרה.`],
[`אחי אוהב כדורגל, ___ אחותי מעדיפה כדורסל.`,[`ואילו`,`לכן`,`כי`,`כדי`],`"ואילו" מביעה <b>ניגוד</b> בין שני דברים: אחי לעומת אחותי.`],
[`מה הקשר שיוצרת מילת הקישור "לפיכך"?`,[`תוצאה`,`ניגוד`,`סיבה`,`הוספה`],`"לפיכך" = לכן, על כן. זו מילת <b>תוצאה</b>.`],
[`"כלומר" היא מילת קישור של:`,[`הסבר (פירוש)`,`ויתור`,`תנאי`,`זמן`],`"כלומר" באה להסביר במילים אחרות את מה שנאמר קודם – <b>הסבר</b>.`],
[`"אף על פי ש" מביעה קשר של:`,[`ויתור`,`סיבה`,`תכלית`,`תוצאה`],`"אף על פי ש" = "למרות ש" – קשר של <b>ויתור</b>.`],
[`"משום ש" מביעה קשר של:`,[`סיבה`,`תוצאה`,`תכלית`,`הוספה`],`"משום ש" = "כי", "מפני ש" – <b>סיבה</b>.`],
[`איזו מילת קישור מביעה הוספה?`,[`כמו כן`,`לעומת זאת`,`לכן`,`כי`],`"כמו כן" = בנוסף, וגם – <b>הוספה</b>.`],
[`באיזו מילה מתאים לפתוח את פסקת הסיכום?`,[`לסיכום`,`לדוגמה`,`אולם`,`משום ש`],`"לסיכום" פותחת סיכום של הטקסט.`],
[`"הכביש היה רטוב, לכן הנסיעה הייתה איטית." במקום "לכן" אפשר לכתוב:`,[`על כן`,`אולם`,`כגון`,`כדי ש`],`"על כן" היא גם מילת <b>תוצאה</b>, כמו "לכן". המשמעות נשמרת.`],
[`"הסרט היה ארוך, אבל מעניין." במקום "אבל" אפשר לכתוב:`,[`אך`,`לכן`,`כי`,`כלומר`],`"אך" היא גם מילת <b>ניגוד</b>, כמו "אבל".`],
[`"נשארנו בבית כי היה חם מאוד." במקום "כי" אפשר לכתוב:`,[`מפני ש`,`כדי ש`,`אף על פי ש`,`לכן`],`"מפני ש" היא גם מילת <b>סיבה</b>, כמו "כי".`],
[`___ שהגענו לים, נכנסנו מיד למים.`,[`ברגע`,`למרות`,`כדי`,`אלא`],`"ברגע ש" מביעה <b>זמן</b>: מתי נכנסנו? ברגע שהגענו.`],
[`המורה הסבירה שוב, ___ שכולם יבינו.`,[`כדי`,`משום`,`אולם`,`לכן`],`"כדי ש" מביעה <b>תכלית</b>: המטרה – שכולם יבינו.`],
[`במשפט "ירד שלג, ולכן בית הספר נסגר" – מהי הסיבה ומהי התוצאה?`,[`סיבה: ירד שלג. תוצאה: בית הספר נסגר.`,`סיבה: בית הספר נסגר. תוצאה: ירד שלג.`,`שני החלקים הם סיבות.`,`אין במשפט סיבה ותוצאה.`],`מה שבא <b>לפני</b> "לכן" הוא הסיבה, ומה שבא <b>אחרי</b> "לכן" הוא התוצאה.`],
[`במשפט "אף על פי שהתאמנו קשה, הפסדנו" הקשר הוא:`,[`ויתור`,`סיבה ותוצאה`,`תכלית`,`תנאי`],`התאמנו – ובכל זאת הפסדנו. ציפינו לתוצאה אחרת = <b>ויתור</b>.`],
[`איזו מילת קישור מביעה זמן?`,[`לאחר מכן`,`כלומר`,`למשל`,`אולם`],`"לאחר מכן" מסדרת אירועים לפי <b>זמן</b>.`],
[`איזו מילה <u>אינה</u> מביעה ניגוד?`,[`לפיכך`,`אולם`,`אך`,`לעומת זאת`],`"לפיכך" מביעה <b>תוצאה</b>. כל השאר הן מילות ניגוד.`],

[2,`המילה "אבל" בפסקה האחרונה מקשרת בין:`,[`"הגשר לא זכה במקום הראשון" לבין "הוא החזק ביותר"`,`"נועם מעד" לבין "הקופסה נפלה"`,`"שירה ראתה אותו" לבין "יש לי דבק"`,`"שלושה שבועות" לבין "הדביק קיסמים"`],`"אבל" יוצרת <b>ניגוד</b>: לא זכה במקום הראשון – אבל היה החזק ביותר.`],

const NF=['','אחת','שתיים','שלוש','ארבע','חמש','שש','שבע','שמונה','תשע','עשר'];

const TM=['','אחד','שנים','שלושה','ארבעה','חמישה','שישה','שבעה','שמונה','תשעה'];

function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function gLine(n){
  const m=n[2]==='m';
  let s=m?`"${n[0]}" הוא שם עצם בזכר (${n[0]} אחד)`:`"${n[0]}" היא שם עצם בנקבה (${n[0]} אחת)`;
  if(n[3]) s+=m?` – גם אם ברבים הוא מסתיים ב־<b>ות</b>!`:` – גם אם ברבים היא מסתיימת ב־<b>ים</b>!`;
  return s;
}
function phrase(n,num,right){ // absolute form 3-10
  const m=n[2]==='m'; const useM=right?m:!m;
  return (useM?NM[num]:NF[num])+' '+n[1];
}
function genNum(){
  const t=Math.random();
  const nounPool=Math.random()<.55?NOUNS.filter(n=>n[3]):NOUNS;
  const n=pick(nounPool), m=n[2]==='m';
  if(t<.34){
    const k=pick([3,4,5,6,7,9,10]);
    const ok=m?NM[k]:NF[k];
    return {q:`השלימו את המספר (${k}):<br>___ ${n[1]}`,o:[ok,m?NF[k]:NM[k],NMS[k]],ex:`${gLine(n)}.<br>בזכר המספר מסתיים ב־ה (${NM[k]}), בנקבה – בלי ה (${NF[k]}).<br>לכן: <b>${ok} ${n[1]}</b>.`};
  }
  if(t<.52){
    const k=pick([3,4,5,6,7,9,10]);
    const ok=m?NMS[k]:NF[k];
    const ex=m?`${gLine(n)}.<br>כשאחרי המספר בא שם עצם <b>מיודע</b> (עם ה'), בזכר משתמשים בצורת סמיכות: <b>${NMS[k]} ה${n[1]}</b>.`:`${gLine(n)}.<br>בנקבה המספר לא משתנה גם כשבא אחריו ה' הידיעה: <b>${NF[k]} ה${n[1]}</b>.`;
    return {q:`השלימו את המספר (${k}):<br>___ ה${n[1]}`,o:[ok,...[NMS[k],NM[k],NF[k]].filter(x=>x!==ok)].slice(0,3),ex};
  }
  if(t<.70){
    const u=pick([1,2,3,4,5,6,7,9]);
    const mf=TM[u]+' עשר', ff=TF[u]+' עשרה', hy=TM[u]+' עשרה';
    const ok=m?mf:ff;
    return {q:`השלימו את המספר (${10+u}):<br>___ ${n[1]}`,o:[ok,m?ff:mf,hy],ex:`${gLine(n)}.<br>11–19 בזכר: ${mf}. בנקבה: ${ff}.<br>לכן: <b>${ok} ${n[1]}</b>.`};
  }
  if(t<.82){
    const ok=m?'שני':'שתי';
    return {q:`השלימו את המספר (2):<br>___ ${n[1]}`,o:[ok,m?'שתי':'שני',m?'שניים':'שתיים'],ex:`${gLine(n)}.<br>לפני שם עצם אומרים <b>שני</b> (זכר) או <b>שתי</b> (נקבה). "שניים/שתיים" רק כשהמספר עומד לבד.<br>לכן: <b>${ok} ${n[1]}</b>.`};
  }
  // which phrase is correct
  const k=()=>pick([3,4,5,6,7,9,10]);
  const tricky=NOUNS.filter(x=>x[3]);
  const others=shuffle(NOUNS.filter(x=>x!==n)).slice(0,3);
  if(Math.random()<.5){
    const a=k(); const ok=phrase(n,a,true);
    return {q:`איזה צירוף כתוב <u>נכון</u>?`,o:[ok,...others.map(x=>phrase(x,k(),false))],ex:`${gLine(n)}, ולכן: <b>${ok}</b>.<br>בשאר הצירופים המספר לא מתאים למין של שם העצם.`};
  }
  const nn=pick(tricky), a=k(); const bad=phrase(nn,a,false), fix=phrase(nn,a,true);
  const rest=shuffle(NOUNS.filter(x=>x!==nn)).slice(0,3).map(x=>phrase(x,k(),true));
  return {q:`באיזה צירוף יש <u>טעות</u>?`,o:[bad,...rest],ex:`${gLine(nn)}.<br>הנכון: <b>${fix}</b>.`};
}

const TEX={};
function mk(name,fn){const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d');fn(g);TEX[name]=c}
function noise(g,cols,seed){const r=rng(seed);for(let y=0;y<16;y++)for(let x=0;x<16;x++){g.fillStyle=cols[Math.floor(r()*cols.length)];g.fillRect(x,y,1,1)}}
function ore(g,c1,c2,seed){const r=rng(seed);for(let i=0;i<5;i++){const x=1+Math.floor(r()*12),y=1+Math.floor(r()*12);g.fillStyle=c1;g.fillRect(x,y,3,2);g.fillRect(x+1,y-1,1,1);g.fillStyle=c2;g.fillRect(x,y,1,1)}}

 const dirt=['#7a5634','#86603a','#6d4c2d','#8e6741','#5f4127'];

 const deep=['#3b2a4d','#43305a','#33243f','#4a3863','#2c2038'];
 mk('dirt',g=>noise(g,dirt,11));
 mk('grass',g=>{noise(g,dirt,12);const r=rng(5);for(let x=0;x<16;x++){const d=3+Math.floor(r()*2);for(let y=0;y<d;y++){g.fillStyle=r()<.5?'#5aa83a':'#69b947';g.fillRect(x,y,1,1)}}});
 mk('stone',g=>noise(g,stone,13));

 mk('iron',g=>{noise(g,stone,17);ore(g,'#d9a07a','#f3c9a8',4)});
 mk('gold',g=>{noise(g,dark,18);ore(g,'#f5d142','#fff3a8',6)});

 mk('seal',g=>{noise(g,['#2a1838','#311c42','#24142f'],20);g.fillStyle='#b04fe0';[[3,3],[12,3],[3,12],[12,12],[7,7],[8,8],[7,8],[8,7],[5,5],[10,10],[5,10],[10,5]].forEach(p=>g.fillRect(p[0],p[1],1,1));g.strokeStyle='#7a2fa8';g.strokeRect(1.5,1.5,13,13)});
 mk('bedrock',g=>noise(g,['#1a1a1a','#333','#262626','#4a4a4a','#111'],21));
 mk('log',g=>{noise(g,['#6b4a2a','#7a5632','#5c3f23'],22);g.fillStyle='#4a321b';for(let x=2;x<16;x+=4)g.fillRect(x,0,1,16)});

 ['dirt','stone','dark','deep'].forEach(n=>{const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d');g.drawImage(TEX[n],0,0);g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,16,16);TEX['bg_'+n]=c});
}

function pickCanvas(tier,size=16){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');drawPix(g,PICK,{H:TOOL_COL[tier],W:'#7a5634'},0,0,size/8);return c}

let S=null;

function newState(){
 const seed=(Date.now()&0xffffff)||7;
 return {grid:Array.from(genWorld(seed)),px:15,py:SURF-1,face:1,inv:[0,0,0,0],tier:0,
  stats:{conn:{c:0,w:0},num:{c:0,w:0},id:{c:0,w:0},read:{c:0,w:0}},mistakes:[],queues:{},seen:[false,false,false,false],
  xp:0,streak:0,best:0,bossWins:0,muted:false};
}
function genWorld(seed){
 const r=rng(seed);const g=new Uint8Array(W*H);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  let id=0;
  if(y<SURF)id=0;else if(y===SURF)id=1;
  else if(y<SEAL){const z=zoneAt(y);id=ZONES[z].base;if(z>0&&y===ZONES[z].top&&r()<.4)id=ZONES[z-1].base;if(z<3&&y===ZONES[z].bot&&r()<.25)id=ZONES[z+1].base}
  else if(y===SEAL)id=10;else if(y<BED)id=0;else id=11;
  if(y>SURF&&y<=SEAL&&(x===0||x===W-1))id=11;
  if(y>SEAL&&y<BED&&(x<=1||x>=W-2))id=11;
  g[y*W+x]=id;
 }
 for(let z=0;z<4;z++){const Z=ZONES[z];for(let i=0;i<3;i++){const cx=3+Math.floor(r()*(W-6)),cy=Z.top+2+Math.floor(r()*(Z.bot-Z.top-4));const rx=2+Math.floor(r()*2),ry=1;
  for(let dy=-ry;dy<=ry;dy++)for(let dx=-rx;dx<=rx;dx++){const x=cx+dx,y=cy+dy;if(x>0&&x<W-1&&y>SURF+2&&y<SEAL&&(dx*dx)/(rx*rx)+(dy*dy)/(ry*ry+.5)<=1)g[y*W+x]=0}}}
 for(let z=0;z<4;z++)placeOres(g,z,16,r);
 for(const tx of [3,8,22,26]){
  for(let y=SURF-3;y<SURF;y++)g[y*W+tx]=12;
  for(let y=SURF-5;y<=SURF-4;y++)for(let dx=-2;dx<=2;dx++)if(!g[y*W+tx+dx])g[y*W+tx+dx]=13;
  for(let dx=-1;dx<=1;dx++)g[(SURF-6>=0?SURF-6:0)*W+tx+dx]=13;
 }
 return g;
}
function placeOres(g,z,n,r){const Z=ZONES[z];r=r||Math.random;let placed=0,tries=0;
 while(placed<n&&tries<2000){tries++;const x=1+Math.floor(r()*(W-2)),y=Z.top+1+Math.floor(r()*(Z.bot-Z.top));const i=y*W+x;
  if(g[i]===Z.base&&!(z===0&&Math.abs(x-15)<2&&y<SURF+3)){g[i]=Z.ore;placed++}}}
function ensureOres(z){const Z=ZONES[z];let c=0;for(let y=Z.top;y<=Z.bot;y++)for(let x=0;x<W;x++)if(S.grid[y*W+x]===Z.ore)c++;if(c<5)placeOres(S.grid,z,6)}

function get(x,y){if(x<0||x>=W||y<0)return 0;if(y>=H)return 11;return S.grid[y*W+x]}
function set(x,y,v){S.grid[y*W+x]=v}
function solid(x,y){if(x<0||x>=W)return true;return get(x,y)!==0}

/* ================= QUESTIONS ================= */
function bankFor(t){return t==='conn'?CONN:t==='id'?IDQ:t==='read'?READQ:NUM_STATIC}
function buildQueue(t){
 const bank=bankFor(t);
 if(t==='read'){const order=shuffle([0,1,2]);const q=[];order.forEach(p=>READQ.forEach((x,i)=>{if(x[0]===p)q.push(i)}));return q}
 if(t==='id'){const order=shuffle([0,1,2,3]);const q=[];order.forEach(p=>IDQ.forEach((x,i)=>{if(x[0]===p)q.push(i)}));const gen=shuffle(IDQ.map((x,i)=>x[0]<0?i:-1).filter(i=>i>=0));gen.forEach((g,k)=>q.splice(Math.min(q.length,3+k*4),0,g));return q}
 return shuffle(bank.map((_,i)=>i));
}
function nextQ(t){
 if(t==='num'&&Math.random()<.72){const g=genNum();return {topic:'num',key:null,q:g.q,ans:g.o[0],opts:shuffle(g.o),ex:g.ex,doc:null}}
 const qk=t==='num'?'numS':t;
 if(!S.queues[qk]||!S.queues[qk].length)S.queues[qk]=buildQueue(t);
 const i=S.queues[qk].shift();const bank=bankFor(t);const it=bank[i];
 if(t==='read')return {topic:t,key:i,q:it[1],ans:it[2][0],opts:shuffle(it[2]),ex:it[3],doc:PASSAGES[it[0]]};
 if(t==='id')return {topic:t,key:i,q:it[1],ans:it[2][0],opts:shuffle(it[2]),ex:it[3],doc:it[0]>=0?CARDS[it[0]]:null};
 return {topic:t,key:i,q:it[0],ans:it[1][0],opts:shuffle(it[1]),ex:it[2],doc:null};
}
function requeue(q){if(q.key===null)return;const qk=q.topic==='num'?'numS':q.topic;const a=S.queues[qk]||(S.queues[qk]=[]);a.splice(Math.min(a.length,2),0,q.key)}
function docHTML(d){return `<div class="doc"><div class="doc-t">${d.title}</div><div class="doc-by">מאת: ${d.author} · מתוך: ${d.source} · ${d.date}</div>${d.paras.map(p=>`<p>${p}</p>`).join('')}</div>`}
function strip(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent}

function ask(q,cb,boss){
 const chip=boss?`<span class="chip" style="background:${TOPIC_COL.boss}">⚔️ קרב – ${TOPIC_NAME[q.topic]}</span>`:`<span class="chip" style="background:${TOPIC_COL[q.topic]}">${TOPIC_NAME[q.topic]}</span>`;
 openPanel(`${boss?bossBarHTML():''}${chip}${q.doc?docHTML(q.doc):''}<div class="qtext">${q.q}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div><div id="fbx"></div>`);
 if(boss)drawBossIcon();
 panel.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  const chosen=q.opts[+b.dataset.i];const ok=chosen===q.ans;
  panel.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(q.opts[+x.dataset.i]===q.ans)x.classList.add('ok')});
  if(!ok)b.classList.add('bad');
  const st=S.stats[q.topic];
  if(ok){st.c++;S.streak++;S.best=Math.max(S.best,S.streak);S.xp+=10+Math.min(S.streak,10)*2;SFX.correct()}
  recAnswer({t:Date.now(),k:q.topic,boss:boss||undefined,q:strip(q.q)+(q.doc?` [${q.doc.title}]`:''),a:strip(chosen),c:strip(q.ans),ok});
  if(!ok){st.w++;S.streak=0;SFX.wrong();requeue(q);S.mistakes.unshift({t:q.topic,q:strip(q.q),a:strip(q.ans),c:strip(chosen)});S.mistakes=S.mistakes.slice(0,40)}
  const head=ok?pick(['כל הכבוד! ✔','מעולה! ✔','בול! ✔','נכון! ✔']):'לא נכון ✘';
  $('fbx').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${head}</b><br>${q.ex}</div><button class="btn" id="cont">${ok?'המשך ⛏️':'הבנתי, ממשיכים'}</button>`;
  updateHUD();save();
  const c=$('cont');c.focus();c.onclick=()=>{closePanel();cb(ok)};
  $('fbx').scrollIntoView({block:'nearest'});
 });
}

async function initFirebase(){

 correct(){beep(523,.1,'square',.06,0,0);beep(659,.1,'square',.06,0,.09);beep(784,.18,'square',.06,0,.18)},
 wrong(){beep(220,.28,'sawtooth',.05,90)},
 craft(){[392,523,659,784,1046].forEach((f,i)=>beep(f,.12,'triangle',.07,0,i*.07))},
 hit(){beep(110,.2,'square',.09,50)},
 deny(){beep(120,.1,'square',.05,0);beep(100,.12,'square',.05,0,.1)},
 win(){[523,659,784,1046,784,1046,1318].forEach((f,i)=>beep(f,.16,'square',.06,0,i*.12))}
};

/* ================= GAME LOOP ================= */
const cv=$('game'),ctx=cv.getContext('2d');
let T=40,VW=0,VH=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;T=Math.max(32,Math.min(54,Math.floor(Math.min(VW/14,VH/11))));ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false}
addEventListener('resize',resize);

let rx=15,ry=SURF-1,airUntil=0,lastFall=0,swing=0,shake=0;
let parts=[],floats=[],clouds=[];
const held=new Set();let lastAct=0,lastKey='';

function act(k){
 if(modal)return;
 const now=performance.now();
 if(k==='L'||k==='R'){
  const dx=k==='L'?-1:1;S.face=dx;const tx=S.px+dx;
  if(!solid(tx,S.py)){S.px=tx;SFX.step();if(S.py>SURF)saveSoon()}
  else mine(tx,S.py);
 }else if(k==='U'){
  if(solid(S.px,S.py-1)){if(S.py-1>=0)mine(S.px,S.py-1)}
  else if(solid(S.px,S.py+1)){S.py-=1;airUntil=now+380}
 }else if(k==='D'){
  if(solid(S.px,S.py+1))mine(S.px,S.py+1);
 }
}
function mine(x,y){
 const id=get(x,y);if(!id)return;const b=B[id];swing=1;
 if(id===11){toast('זה סלע יסוד – אי אפשר לחצוב אותו.');SFX.deny();shake=6;return}
 if(b.seal){
  if(S.inv[3]>=BOSS_NEED){startBoss()}else{toast(`🔒 החותם נפתח רק עם ${BOSS_NEED} יהלומים (יש לך ${S.inv[3]}).`);SFX.deny();shake=6}
  return;
 }
 if(b.h>S.tier){
  const need=b.h;toast(`הבלוק קשה מדי ל${TOOLS[S.tier]}!<br>צריך <b>${TOOLS[need]}</b> – אסוף ${NEED} ${ZONES[need-1].oname} ובנה אותו ב־🛠️`,3400);SFX.deny();shake=6;return;
 }
 if(b.ore!==undefined){
  const z=b.ore;const Z=ZONES[z];
  ask(nextQ(Z.topic),ok=>{
   if(ok){set(x,y,0);S.inv[z]++;burst(x,y,b.pc,18);floats.push({x:x+.5,y:y,txt:`+1 ${Z.oname}`,life:1.4,col:Z.color});
    if(S.inv[z]===NEED&&S.tier===z&&z<3)setTimeout(()=>toast(`יש לך ${NEED} ${Z.oname}! לחץ על 🛠️ כדי לבנות ${TOOLS[z+1]}`,3800),300);
    if(z===3&&S.inv[3]===BOSS_NEED)setTimeout(()=>toast(`💎 יש לך ${BOSS_NEED} יהלומים! רדו לחותם הסגול בתחתית.`,3800),300);
   }else{set(x,y,Z.base);burst(x,y,['#999','#555'],8)}
   ensureOres(z);updateHUD();save();
  });
  return;
 }
 set(x,y,0);burst(x,y,b.pc,10);SFX.mine();saveSoon();
}
function burst(x,y,cols,n){for(let i=0;i<n;i++)parts.push({x:x+.5,y:y+.5,vx:(Math.random()-.5)*5,vy:-Math.random()*4-1,life:.6+Math.random()*.4,c:cols[i%cols.length],s:.1+Math.random()*.1})}

function physics(now){
 if(modal)return;
 if(now>airUntil&&!solid(S.px,S.py+1)&&S.py<H-1){
  if(now-lastFall>75){S.py++;lastFall=now;saveSoon()}
 }
 // zone entry
 const zk=S.py>SEAL?4:zoneAt(Math.max(S.py,SURF+1));if(zk!==lastZone){lastZone=zk;updateHUD()}
 if(S.py>=SURF){const z=zoneAt(S.py);if(S.py<=SEAL&&!S.seen[z]){S.seen[z]=true;save();banner(ZONES[z].name,`נושא: ${ZONES[z].tname}`);setTimeout(()=>zoneIntro(z),700)}}
}
let lastZone=-1;
function input(now){
 if(modal||!held.size)return;
 const k=[...held].pop();
 if(k!==lastKey||now-lastAct>=150){act(k);lastAct=now;lastKey=k}
}

let prev=performance.now();
function frame(now){
 const dt=Math.min(.05,(now-prev)/1000);prev=now;
 input(now);physics(now);
 rx+=(S.px-rx)*Math.min(1,dt*16);ry+=(S.py-ry)*Math.min(1,dt*16);
 if(Math.abs(S.px-rx)>6)rx=S.px;if(Math.abs(S.py-ry)>6)ry=S.py;
 swing=Math.max(0,swing-dt*5);shake=Math.max(0,shake-dt*40);
 parts.forEach(p=>{p.vy+=12*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});parts=parts.filter(p=>p.life>0);
 floats.forEach(f=>{f.y-=dt*1.2;f.life-=dt});floats=floats.filter(f=>f.life>0);
 confParts.forEach(p=>{p.vy+=200*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.life-=dt});confParts=confParts.filter(p=>p.life>0);
 draw(now);
 requestAnimationFrame(frame);
}

function draw(now){
 const cw=VW,ch=VH;
 let camX=rx*T+T/2-cw/2, camY=ry*T+T/2-ch/2+T*.5;
 camX=Math.max(0,Math.min(W*T-cw,camX));if(W*T<cw)camX=(W*T-cw)/2;
 camY=Math.max(-T*3,Math.min(H*T-ch,camY));
 if(shake){camX+=(Math.random()-.5)*shake;camY+=(Math.random()-.5)*shake}
 // sky
 const sky=ctx.createLinearGradient(0,0,0,ch);sky.addColorStop(0,'#6cc4ff');sky.addColorStop(1,'#b8e4ff');ctx.fillStyle=sky;ctx.fillRect(0,0,cw,ch);
 // sun & clouds
 const sunY=-camY*.3+20;if(sunY>-80){ctx.fillStyle='#fff6a0';ctx.fillRect(cw*.18,sunY,46,46);ctx.fillStyle='#ffe85a';ctx.fillRect(cw*.18+8,sunY+8,30,30)}
 clouds.forEach(c=>{c.x+=c.v;if(c.x>W*T+200)c.x=-200;const sx=c.x-camX*.6,sy=c.y*T-camY;ctx.fillStyle='rgba(255,255,255,.92)';ctx.fillRect(sx,sy,c.w*T*.5,T*.5);ctx.fillRect(sx+T*.5,sy-T*.25,c.w*T*.3,T*.3)});
 const x0=Math.max(0,Math.floor(camX/T)),x1=Math.min(W-1,Math.ceil((camX+cw)/T)),y0=Math.max(0,Math.floor(camY/T)),y1=Math.min(H-1,Math.ceil((camY+ch)/T));
 // area outside world horizontally
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
  const id=S.grid[y*W+x];const sx=Math.round(x*T-camX),sy=Math.round(y*T-camY);
  if(id){ctx.drawImage(TEX[B[id].t],sx,sy,T,T)}
  else if(y>SURF){const bg=y>SEAL?'bg_deep':'bg_'+B[ZONES[zoneAt(y)].base].t;ctx.drawImage(TEX[bg],sx,sy,T,T)}
 }
 // seal glow
 if(SEAL>=y0&&SEAL<=y1){ctx.fillStyle=`rgba(200,110,255,${.12+.1*Math.sin(now/300)})`;ctx.fillRect(-camX,SEAL*T-camY,W*T,T)}
 // boss sleeping in cave
 const bx=(W/2-1)*T-camX,by=(BED-2)*T-camY;
 if(by<ch+T*3&&by>-T*3&&!celebrating){const bob=S.bossWins?0:Math.sin(now/600)*2,sc=T*2.2/16,bx0=bx-T*.5,by0=by-T*.9+bob;drawPix(ctx,BOSS,BCOL,bx0,by0,sc);if(S.bossWins===0){ctx.fillStyle='#fff';ctx.font=`700 ${Math.round(T*.4)}px Rubik`;ctx.fillText('Zz',bx+T*1.8,by-T*.8+bob)}else{ctx.strokeStyle='#e0312b';ctx.lineWidth=T*.18;ctx.beginPath();ctx.moveTo(bx0,by0);ctx.lineTo(bx0+14*sc,by0+16*sc);ctx.moveTo(bx0+14*sc,by0);ctx.lineTo(bx0,by0+16*sc);ctx.stroke()}}
 // player
 const pxs=rx*T-camX,pys=ry*T-camY;const s=T/12;
 const flip=S.face<0;
 drawPix(ctx,PLAYER,PCOL,pxs+(T-8*s)/2,pys,s,flip);
 ctx.save();const hx=pxs+T/2+(flip?-1:1)*T*.32,hy=pys+T*.62;ctx.translate(hx,hy);ctx.scale(flip?-1:1,1);ctx.rotate(-.6+swing*1.6);drawPix(ctx,PICK,{H:TOOL_COL[S.tier],W:'#7a5634'},-T*.1,-T*.45,T*.06);ctx.restore();
 // particles
 parts.forEach(p=>{ctx.fillStyle=p.c;ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillRect(p.x*T-camX,p.y*T-camY,p.s*T,p.s*T)});ctx.globalAlpha=1;
 // darkness
 const depth=ry<=SURF+1?0:ry<19?.25:ry<31?.45:ry<43?.62:.72;
 if(depth>0){const lx=pxs+T/2,ly=pys+T/2,R=T*(4.5-depth*1.5);
  const gr=ctx.createRadialGradient(lx,ly,R*.25,lx,ly,R);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,`rgba(0,0,8,${depth})`);ctx.fillStyle=gr;ctx.fillRect(0,0,cw,ch)}
 // floats
 floats.forEach(f=>{ctx.globalAlpha=Math.min(1,f.life);ctx.font=`900 ${Math.round(T*.42)}px Rubik`;ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText(f.txt,f.x*T-camX+2,f.y*T-camY+2);ctx.fillStyle=f.col==='#3b3b3b'?'#fff':f.col;ctx.fillText(f.txt,f.x*T-camX,f.y*T-camY)});ctx.globalAlpha=1;ctx.textAlign='start';
 // confetti
 confParts.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-4,-2,8,4);ctx.restore()});
}
let confParts=[];
function confetti(ox,oy){ox=ox??VW/2;oy=oy??VH*.35;const cols=['#f2c418','#e8772e','#3fe0d8','#b04fe0','#5aa83a','#fff'];for(let i=0;i<160;i++)confParts.push({x:ox,y:oy,vx:(Math.random()-.5)*700,vy:-Math.random()*500-150,r:Math.random()*6,vr:(Math.random()-.5)*10,c:pick(cols),life:3+Math.random()})}

/* ================= INPUT BINDINGS ================= */
const KEYMAP={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowUp:'U',KeyW:'U',Space:'U',ArrowDown:'D',KeyS:'D'};
addEventListener('keydown',e=>{
 if($('parent').classList.contains('on')){if(e.key==='Escape')closeParent();return}
 if(e.target&&e.target.tagName==='INPUT')return;
 if(modal){if(e.code==='Enter'||e.code==='Space'){const c=$('cont');if(c){e.preventDefault();c.click()}}else if(/^Digit[1-4]$/.test(e.code)){const b=panel.querySelectorAll('.opt:not(:disabled)')[+e.code.slice(5)-1];if(b)b.click()}else if(e.code==='Escape'&&!panel.querySelector('.opt')&&!boss){const c=$('cls');if(c)c.click()}return}
 const k=KEYMAP[e.code];if(!k)return;e.preventDefault();audioInit();
 if(!held.has(k)){held.delete(k);held.add(k);act(k);lastAct=performance.now();lastKey=k}
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)held.delete(k)});
addEventListener('blur',()=>held.clear());
document.querySelectorAll('#pad button').forEach(b=>{
 const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();b.classList.add('on');held.delete(k);held.add(k);act(k);lastAct=performance.now();lastKey=k});
 const up=()=>{b.classList.remove('on');held.delete(k)};
 b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);
 b.addEventListener('contextmenu',e=>e.preventDefault());
});
addEventListener('pointerdown',()=>audioInit(),true);
cv.addEventListener('pointerdown',e=>{
 if(modal)return;audioInit();
 const cw=VW,ch=VH;let camX=rx*T+T/2-cw/2,camY=ry*T+T/2-ch/2+T*.5;camX=Math.max(0,Math.min(W*T-cw,camX));if(W*T<cw)camX=(W*T-cw)/2;camY=Math.max(-T*3,Math.min(H*T-ch,camY));
 const cx=Math.floor((e.clientX+camX)/T),cy=Math.floor((e.clientY+camY)/T);
 const dx=cx-S.px,dy=cy-S.py;
 if(dx===0&&dy===1)act('D');else if(dx===0&&dy===-1)act('U');
 else if(dy===0&&Math.abs(dx)>=1)act(dx<0?'L':'R');
 else if(Math.abs(dx)>=1&&dy<0)act('U');
 else if(Math.abs(dx)>=1)act(dx<0?'L':'R');
});
$('bCraft').onclick=()=>{if(!boss)openCraft()};
$('bStats').onclick=()=>{if(!boss)openStats()};
$('bHelp').onclick=()=>{if(!boss)openHelp()};
$('bMute').onclick=()=>{S.muted=!S.muted;updateHUD();save()};
$('bMusic').onclick=()=>{audioInit();S.music=S.music===false;updateHUD();save();toast(S.music===false?'המוזיקה כבויה 🔇':'המוזיקה פועלת 🎵',1500)};

/* ================= BOOT ================= */
buildTextures();resize();
S=load()||newState();
rx=S.px;ry=S.py;
for(let i=0;i<7;i++)clouds.push({x:Math.random()*W*T,y:.5+Math.random()*2.5,w:2+Math.random()*3,v:.15+Math.random()*.25});
updateHUD();
if(location.hash==='#parents')openParent();else showStart();
initCloud();
requestAnimationFrame(frame);
</script>
